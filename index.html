<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جنگ کاغذی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f8fc;--line:#b9d3f0;--ink:#1b2f5b;--red:#d4474f;--gold:#e0a526;--ok:#2f8f5b}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);min-height:100vh;padding:0 12px 40px 16px;border-right:3px solid var(--red);max-width:560px;margin:auto}
h1{font-weight:900;font-size:26px;padding:12px 0 2px}
.sub{font-size:12.5px;opacity:.75}
.box{background:#fffefa;border:2px solid var(--ink);border-radius:6px 14px 6px 14px;padding:10px;margin-bottom:10px}
input,button{font:inherit}
input{width:100%;padding:10px;border:2px solid var(--ink);border-radius:8px;margin:8px 0;background:#fff}
button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:24px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{background:#fff;color:var(--ink);border:2px solid var(--ink);padding:4px 8px;font-size:13px}
.chip.sel{background:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.bar{height:8px;background:#dbe6f5;border-radius:4px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ok)}
.tabs button{flex:1 0 22%;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:7px 2px}
.tabs button.on{background:var(--ink);color:#fff}
.g{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;direction:ltr;margin:8px 0}
.c{aspect-ratio:1;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:0;font-size:18px;position:relative;line-height:1}
.c i{position:absolute;bottom:0;right:2px;font-size:8px;font-style:normal;opacity:.7}
.c.me{background:var(--ink);color:#fff}.c.al{background:var(--gold)}.c.en{background:#f3b8bb}.c.fr{background:#fff;border-style:dashed}
.c.hq{background:#fde9a8}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row small{display:block;opacity:.7;font-size:12px}
.log{font-size:12.5px;line-height:1.9}
.err{position:fixed;bottom:16px;left:12px;right:12px;max-width:520px;margin:auto;background:var(--red);color:#fff;padding:10px;border-radius:10px;text-align:center}
.hide{display:none!important}
#hb{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:50;background:var(--gold);color:var(--ink);font-weight:900;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
#hm,#am{position:fixed;inset:0;z-index:60;background:rgba(27,47,91,.55);display:flex;align-items:flex-end;justify-content:center}
#hm>div,#am>div{background:#fffefa;width:100%;max-width:640px;max-height:92%;overflow:auto;border:2px solid var(--ink);border-radius:16px 16px 0 0;padding:12px;font-size:14px;line-height:1.9}
#hm details{border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:4px 8px;background:#fff}
#hm summary{font-weight:900;cursor:pointer;padding:4px 0}
#hm table{width:100%;border-collapse:collapse;font-size:13px}#hm td,#hm th{border:1px solid var(--line);padding:3px 5px;text-align:right}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--ink);vertical-align:middle;margin-left:4px}
#hm p{margin:4px 0}
</style>
</head>
<body>
<button id="hb">❓ راهنما</button>
<h1>جنگ کاغذی</h1>
<div id="login" class="box">
  <div id="reg">
    <b style="font-size:20px">ثبت نام</b>
    <input id="nm" maxlength="14" placeholder="نام کاربری (مثلاً: کاغذ‌خان)" autocomplete="username">
    <input id="pw" type="password" maxlength="64" placeholder="رمز (حداقل ۴ نویسه)" autocomplete="new-password">
    <button id="go">ثبت نام و ورود به جنگ</button>
    <div class="sub" style="margin-top:14px">از قبل حساب داری؟</div>
    <button id="toLogin" class="chip" style="margin-top:4px">ورود</button>
  </div>
  <div id="lg" class="hide">
    <b style="font-size:20px">ورود</b>
    <input id="ln" maxlength="14" placeholder="نام کاربری" autocomplete="username">
    <input id="lp" type="password" maxlength="64" placeholder="رمز" autocomplete="current-password">
    <button id="lgo">ورود</button>
    <button id="toReg" class="chip" style="margin-top:8px">حساب نداری؟ ثبت نام</button>
  </div>
  <div class="sub" id="st" style="margin-top:8px">در حال اتصال به سرور...</div>
</div>
<div id="game" class="hide">
  <div class="box">
    <div class="top"><b id="who"></b><span class="sub">⭐ <span id="lvl">1</span> · 🏆 <span id="trp">0</span> · 🏴 <span id="caps">0</span> · 🗡️ <span id="tr">0</span></span></div>
    <div class="big">📄 <span id="tk">0</span> تکه</div>
    <div class="bar"><i id="xpb" style="width:0"></i></div>
    <div class="sub" id="inc"></div>
    <div class="chips" id="inv"></div>
    <button id="acb" class="chip" style="margin-top:8px">🔑 حساب / ورود به حساب قدیمی</button> <button id="bn" class="chip" style="margin-top:8px">🎁 پاداش ورود</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="base">زمین</button><button data-t="map">نقشه</button><button data-t="shop">فروشگاه</button><button data-t="ally">اتحاد</button><button data-t="chat">گفتگو</button><button data-t="quest">ماموریت</button><button data-t="emp">امپراطوری</button>
  </div>
  <div id="stage" class="box" style="padding:0;height:min(80vw,400px);overflow:hidden;touch-action:none;display:none"></div>
  <div id="p" class="box"></div>
  <div class="box log" id="log"></div>
</div>
<div id="hm" class="hide"><div><div class="top"><b style="font-size:18px">📖 راهنمای کامل جنگ کاغذی</b><button id="hx">✕ بستن</button></div><div id="hc"></div></div></div>
<div id="am" class="hide"><div><div class="top"><b>🔑 حساب کاربری</b><button id="ax">✕ بستن</button></div>
<p class="sub">ورود به حساب قدیمی (نام کاربری و رمز):</p><input id="an2" maxlength="14" placeholder="نام کاربری"><input id="ap2" type="password" maxlength="64" placeholder="رمز"><button id="alg">ورود به این حساب</button>
<div id="npw" class="hide"><hr style="margin:12px 0"><p class="sub">حساب فعلی‌ات رمز ندارد. رمز بگذار تا از هر دستگاهی بتوانی وارد شوی:</p><input id="np" type="password" maxlength="64" placeholder="رمز جدید (حداقل ۴ نویسه)"><button id="nps">ذخیره رمز</button></div>
<hr style="margin:12px 0"><button id="alo" style="background:var(--red)">خروج از این حساب</button></div></div>
<div id="er" class="err hide"></div>
<script>
const $=s=>document.querySelector(s);
let ws,cat={},Q=[],RLV=[1,30,60],S=null,tab="base",sel=null,id=localStorage.pwid||(localStorage.pwid=crypto.randomUUID());
const HOST="wss://jang-kagazi.mohammad1392reza2931.workers.dev";
let tries=0,connT=0,joined=false;
function autoJoin(){if(localStorage.pwtok)send({t:"join",id,tok:localStorage.pwtok,dev});else if(localStorage.pwname)send({t:"join",id,dev})}
let nag=0,banned=0;const dev=localStorage.pwdev||(localStorage.pwdev=crypto.randomUUID());
function conn(){
  clearTimeout(connT);
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  const url=(location.hostname.endsWith("workers.dev")?location.origin.replace("http","ws"):HOST)+"/ws";
  const w=ws=new WebSocket(url);
  $("#st").textContent="در حال اتصال به سرور..."+(tries?" (تلاش "+(tries+1)+")":"");
  const fail=setTimeout(()=>{if(w.readyState===0)try{w.close()}catch{}},8000);
  w.onopen=()=>{clearTimeout(fail);tries=0;$("#st").textContent="به سرور وصل شد ✓";autoJoin()};
  w.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.t==="cat"){cat=m.cat;Q=m.Q;RLV=m.RLV}
    if(m.t==="err"){toast(m.m);$("#st").textContent=m.m;if(m.bad)localStorage.removeItem("pwtok")}
    if(m.t==="banned"){banned=1;$("#game").classList.add("hide");$("#am").classList.add("hide");$("#login").classList.remove("hide");$("#st").textContent=m.m;toast(m.m)}
    if(m.t==="auth"){id=m.id;localStorage.pwid=id;localStorage.pwtok=m.tok;localStorage.pwname=m.name;$("#am").classList.add("hide")}
    if(m.t==="world"){wData=m;buildWorld()}
    if(m.t==="alert"){toast(m.m);beep(160,.3,"sawtooth");navigator.vibrate&&navigator.vibrate([80,40,80])}
    if(m.t==="state"){S=m;joined=true;$("#login").classList.add("hide");$("#game").classList.remove("hide");try{draw()}catch(x){console.error(x)}if(S.me.nopw&&!nag){nag=1;toast("حسابت رمز ندارد؛ از دکمهٔ 🔑 رمز بگذار")}}};
  w.onerror=()=>{};
  w.onclose=()=>{clearTimeout(fail);if(w!==ws||banned)return;tries++;
    $("#st").textContent="اتصال برقرار نیست، دوباره تلاش می‌کنم...";
    connT=setTimeout(conn,Math.min(1000*tries,5000))};
}
const send=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
function toast(t){const e=$("#er");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.add("hide"),2200)}
const cr=()=>!ws||ws.readyState!==1?(toast("هنوز به سرور وصل نشدم"),0):1;
$("#go").onclick=()=>{const n=$("#nm").value.trim(),p=$("#pw").value;if(!n||p.length<4)return toast("نام و رمز (حداقل ۴ نویسه) لازم است");if(cr())send({t:"reg",name:n,pw:p,dev})};
$("#toLogin").onclick=()=>{$("#reg").classList.add("hide");$("#lg").classList.remove("hide")};$("#toReg").onclick=()=>{$("#lg").classList.add("hide");$("#reg").classList.remove("hide")};
$("#lgo").onclick=()=>{const n=$("#ln").value.trim(),p=$("#lp").value;if(!n||!p)return toast("نام کاربری و رمز را بنویس");if(cr())send({t:"login",name:n,pw:p,dev})};
$("#acb").onclick=()=>{$("#npw").classList.toggle("hide",!(S&&S.me.nopw));$("#am").classList.remove("hide")};$("#ax").onclick=()=>$("#am").classList.add("hide");
$("#alg").onclick=()=>{const n=$("#an2").value.trim(),p=$("#ap2").value;if(!n||!p)return toast("نام کاربری و رمز را بنویس");if(cr())send({t:"login",name:n,pw:p,dev})};
$("#nps").onclick=()=>{const p=$("#np").value;if(p.length<4)return toast("رمز حداقل ۴ نویسه");if(cr())send({t:"setpw",pw:p})};
$("#alo").onclick=()=>{["pwid","pwtok","pwname"].forEach(k=>localStorage.removeItem(k));location.reload()};
$("#tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;draw()}};
const ic=k=>k==="hq"?"🏰":cat[k]?.i||"?";
function draw(){
  const me=S.me,own=S.map.map((m,i)=>m&&m[3]===id?i:-1).filter(i=>i>=0);
  $("#who").textContent=me.name+" · "+rank(me.caps)+" · "+tier(me.lv);$("#bn").disabled=Date.now()<(me.bonus||0);$("#caps").textContent=me.caps;$("#lvl").textContent=me.lv;$("#trp").textContent=me.tr;{const b0=20*(me.lv-1)**2,b1=20*me.lv**2;$("#xpb").style.width=Math.min(100,(me.xp-b0)/(b1-b0)*100)+"%"}$("#tr").textContent=me.traitor;$("#tk").textContent=me.tekke;
  $("#inc").textContent=`درآمد: روزی ${me.inc} تکه (هر روز ۶۰ ثانیه) · ${own.length} زمین`+(me.ally?` · اتحاد «${me.ally}»`:"");
  const inv=Object.entries(me.inv).filter(([,v])=>v>0);
  if(!inv.some(([k])=>k===sel))sel=inv[0]?.[0]||null;
  $("#inv").innerHTML=inv.length?inv.map(([k,v])=>`<button class="chip ${k===sel?"sel":""}" data-s="${k}">${ic(k)} ${cat[k].n} ×${v}</button>`).join(""):"<span class='sub'>انبارت خالیه. از فروشگاه بخر.</span>";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const p=$("#p");
  const showB=tab==="base"&&S.view,showM=tab==="map"&&S.me.lv>=RLV[realm];
  $("#stage").style.display=showB||showM?"block":"none";$("#stage").style.height=showM?"min(115vw,560px)":"min(80vw,400px)";
  mode=showM?"map":"base";if(showB)sync3d();if(showM)worldReq();
  if(tab!=="adm")p.dataset.t="";if(tab==="base")base(p,own);else if(tab==="map")map(p,own);else if(tab==="shop")shop(p);else if(tab==="ally")ally(p);else if(tab==="quest")quest(p);else if(tab==="emp")emp(p);else chat(p);
  p.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>send({t:"view",i:+b.dataset.v}));
  p.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>send({t:"gift",to:b.dataset.g,a:100}));
  $("#log").innerHTML=S.log.map(l=>`<div>${l}</div>`).join("")||"هنوز اتفاقی نیفتاده.";
}
$("#inv").onclick=e=>{if(e.target.dataset.s){sel=e.target.dataset.s;draw()}};
let rep_=false;
const tier=l=>l>=60?"📄 کاغذ A4":l>=30?"📄 کاغذ ناپاره":l>=20?"📄 کاغذ معمولی":l>=10?"📄 کاغذ بی‌آب":"📄 کاغذ آبی";
const rank=n=>n>=10?"فرمانده کل":n>=6?"سرلشکر":n>=3?"سرهنگ":n>=1?"سروان":"سرباز";
$("#bn").onclick=()=>{send({t:"bonus"});beep(700)};
function base(p,own){
  const v=S.view;if(!v){p.textContent="زمینی نداری. از تب نقشه زمین بخر.";return}
  const mine=v.o===id,m=S.map[v.i],al=!mine&&S.me.ally&&m[2]===S.me.ally;
  const sh=v.sh>Date.now()?` · 🛡️ ${Math.ceil((v.sh-Date.now())/1000)} ثانیه`:"";
  p.innerHTML=`<div class="chips">${own.map(i=>`<button class="chip ${i===v.i?"sel":""}" data-v="${i}">${S.map[i][4]||"شهر "+(i+1)}</button>`).join("")}</div>
  <div class="row"><b>🏙️ ${m[4]||"شهر "+(v.i+1)} · ${m[5]} · 👑 ${m[6]}${mine?"":al?" (هم‌پیمان)":" · "+m[0]}${sh}</b>${mine?`<button id="rp" class="chip ${rep_?"sel":""}">🔧 ترمیم</button>`:""}</div>
  <div class="sub">${(()=>{const d=v.g.filter(b=>b&&cat[b.k]?.k==="def"),q=v.g.find(b=>b&&b.k==="hq");return `🛡️ ${d.length} سپر · جان سپرها ${Math.ceil(d.reduce((a,b)=>a+b.hp,0))} · ❤️ مرکز ${Math.ceil(q?.hp||0)}`})()}</div>
  <div class="sub">بکش تا بچرخد · دو انگشت برای زوم · ${mine?"روی خانه بزن تا انتخابت را بچینی؛ روی ساختمان بزنی برمی‌گردد":"سلاح انتخاب کن و روی شهر حریف بزن؛ ضربه بین همه‌ی سپرها پخش می‌شود"}</div>`;
  $("#rp")&&($("#rp").onclick=()=>{rep_=!rep_;draw()});
}
function onCell(c){
  const v=S.view,mine=v.o===id,b=v.g[c],it=cat[sel];
  if(mine){
    if(rep_&&b)send({t:"repair",i:v.i,c});
    else if(b&&b.k!=="hq")send({t:"pick",i:v.i,c});
    else if(!b&&it&&it.k!=="atk"){send({t:"place",i:v.i,c,k:sel});beep(500,.06)}
    else if(!b)toast("اول ساختمان یا دفاع از انبار انتخاب کن");
  }else if(it?.k==="atk"){const mm=S.map[v.i];if(!(S.me.ally&&mm&&mm[2]===S.me.ally)||(atkArm===v.i+":"+c&&Date.now()-atkT<5000))send({t:"atk",i:v.i,c,w:sel});else{atkArm=v.i+":"+c;atkT=Date.now();toast("⚠️ این هم‌پیمان توست! حمله یعنی خیانت. برای تأیید همین خانه را دوباره بزن")}}else toast("اول یک سلاح انتخاب کن");
}
function chat(p){
  if(document.activeElement&&document.activeElement.id==="cx")return;
  p.innerHTML=`<div style="display:flex;gap:6px"><input id="cx" maxlength="80" placeholder="پیام..." style="margin:0"><button id="cs">ارسال</button></div>`+S.chat.map(x=>`<div class="row"><span><b>${x.n}</b>${x.a?` <small style="display:inline">[${x.a}]</small>`:""}<br><span style="word-break:break-word">${x.x||""}</span></span>${x.n===S.me.name?"":`<span style="white-space:nowrap"><button class="chip" data-rp="${x.m}">🚩 گزارش</button></span>`}</div>`).join("");
  $("#cs").onclick=()=>{const x=$("#cx").value;if(x)send({t:"chat",x})};
  p.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>send({t:"report",m:+b.dataset.rp}));
}
let AC;function beep(f,d=.1,ty="square"){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch{}}
// ---------- سه‌بعدی ----------
const COL={cardcastle:0xd9b382,pencil:0xf5d142,ruler:0xaaaaaa,tape:0xe8e0a0,stapwall:0x888888,book:0x3a6ea5,marker:0xdd4477,ink:0x222244,dome:0x99ddee,vault:0x555555,pencil_mine:0xf5d142,printer:0xbbbbbb,library:0xd8c4a0,tekke_bank:0xf2c14e,a4_factory:0xffffff,diamond_wall:0x7fe8ff,gold_mine:0xf2c14e,hq:0xf2c14e,handk:0xffffff,thread:0x8fb8de,ped:0x9b8cf2,wall:0x2f6fd0,eraser:0xf29bb0,clip:0xb0b7c3,card:0xfff1c1,paper_s:0xfafafa,paper_m:0xdfe4ff};
let wroof,wsc,wcam,wsun,wmesh,wplots=[],wlabels=[],wData=null,wRealm=-1,wTimer=0,mode="base",mt={x:35,z:35,d:70},lc={},R,sc,cam,sun,cells={},tiles=[],curI=null,fx=[],lastEv=-1,th=.8,ph=.95,dist=13,ptrs=new Map(),moved=0;
function mk(k){
  const g=new THREE.Group(),C=COL[k]||0xcccccc,met=/vault|ruler|stapwall|marker/.test(k)?.55:.05,
  M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.65,metalness:met}),
  ad=(geo,c,x,y,z,m)=>{const o=new THREE.Mesh(geo,m||M(c));o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o},
  bx=(w,h,d,y,c=C,x=0,z=0)=>ad(new THREE.BoxGeometry(w,h,d),c,x,y+h/2,z),
  cy=(a,b,h,y,c=C,x=0,z=0,s=14)=>ad(new THREE.CylinderGeometry(a,b,h,s),c,x,y+h/2,z),
  co=(r,h,y,c,x=0,z=0,s=14)=>ad(new THREE.ConeGeometry(r,h,s),c,x,y+h/2,z),
  tw=(x,z,c=C,r=.13,h=.9,rc=0xb23a48)=>{cy(r,r,h,0,c,x,z);co(r*1.4,.3,h,rc,x,z)},kd=cat[k]?.k;
  if(k==="hq"){bx(1.15,.25,1.15,0,0xc9a45c);bx(.7,.8,.7,.25);[[-.45,-.45],[.45,-.45],[-.45,.45],[.45,.45]].forEach(([x,z])=>tw(x,z,0xe3c36e,.12,.85));co(.5,.55,1.05,0xd4474f,0,0,4).rotation.y=Math.PI/4;cy(.015,.015,.5,1.5,0x444444);bx(.3,.18,.02,1.8,0xd4474f,.16)}

  (mc?`<div style="margin-top:8px"><b>اسم شهر فعلی (زمین ${v.i+1})</b></div><input id="ci" maxlength="16" placeholder="اسم شهر" value="${S.map[v.i][4]||""}"><button id="cs2">ذخیره اسم شهر</button>`:"")+
  `<div style="margin-top:10px"><b>🏆 جدول جام‌ها</b></div>`+[...S.pub].sort((a,b)=>b.tp-a.tp).map((x,n)=>`<div class="row"><div>${n+1}. ${x.emp} · 👑 ${x.king}<small>${x.name} · سطح ${x.lv} · ${x.n} شهر</small></div><span>🏆 ${x.tp}</span></div>`).join("");

let betArm=0,atkArm="",atkT=0;

  p.innerHTML=(me.ally?`<div class="row"><b>اتحاد «${me.ally}»</b><button id="bt" style="background:var(--red)">${Date.now()-betArm<4000?"⚠️ تأیید خیانت و خروج":"🗡️ خیانت و خروج"}</button></div><div class="sub">هم‌پیمان‌ها نمی‌توانند به هم حمله کنند. اولین حمله به هم‌پیمان خیانت حساب می‌شود و لقب خائن می‌گیری.</div>`:`<div class="sub">برای اتحاد، به یک فرمانده درخواست بده تا قبول کند.</div>`)+
   (rq?`<div style="margin-top:10px"><b>درخواست‌های دریافتی</b></div>${rq}`:"")+

  $("#bt")&&($("#bt").onclick=()=>{if(Date.now()-betArm<4000){betArm=0;send({t:"betray"})}else{betArm=Date.now();toast("برای تأیید خیانت دوباره بزن");draw()}});
  p.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>send({t:"areq",to:b.dataset.ar}));

}
const HELP=[["🎯 هدف بازی (از صفر)", true, "<p>تو یک شهر ۸×۸ خانه‌ای (۶۴ خانه) روی نقشه داری. وسط شهر <b>مرکز فرماندهی 🏰</b> است. با <b>تکه 📄</b> (پول بازی) ساختمان و سلاح می‌خری، اقتصاد می‌سازی، از شهرت دفاع می‌کنی و به شهر دیگران حمله می‌کنی.</p><p><b>باختن:</b> اگر مرکز 🏰 شهرت نابود شود آن زمین را از دست می‌دهی. اگر آخرین زمینت هم برود، با ۵۰۰ تکه و یک زمین تازه از نو شروع می‌کنی.</p><p><b>بردن:</b> بیشتر فتح کن (🏴)، جام 🏆 جمع کن و در جدول‌ها بالا برو.</p>"], ["🚀 شروع سریع (۵ قدم)", false, "<ol style=\"padding-right:18px\"><li>اول از فروشگاه <b>کارخانه کاغذ کوچک 📄</b> بخر و در زمین بچین تا هر روز تکه بدهد.</li><li>دور مرکز چند <b>دیوار آبی 🟦</b> و یک <b>پدافند 📡</b> بچین.</li><li>هر ۱۰ دقیقه «🎁 پاداش ورود» را بزن (۳۰۰ تکه).</li><li>ماموریت‌های روزانه را بگیر.</li><li>یک سلاح ارزان بخر و به شهر یک حریف ضعیف حمله کن.</li></ol><p>برای چیدن: در تب «زمین» یک چیز را از انبار انتخاب کن و روی خانهٔ خالی بزن. برای برداشتن/ترمیم هم روی ساختمان خودت بزن.</p>"], ["🧭 تب‌ها", false, "<p><b>زمین:</b> شهر سه‌بعدی تو. بکش = چرخش، دو انگشت = زوم.<br><b>نقشه:</b> همهٔ زمین‌های سرزمین. زمین دیگران را بزن تا ببینی/حمله کنی؛ زمین سبز را بزن تا بخری.<br><b>فروشگاه:</b> دفاع، حمله، درآمد، و فروشگاه جام.<br><b>اتحاد:</b> هم‌پیمان شدن، خیانت، هدیه.<br><b>گفتگو:</b> چت همگانی.<br><b>ماموریت:</b> ماموریت روزانه و بتل‌پس.<br><b>امپراطوری:</b> نام امپراطوری و پادشاهت، جدول جام‌ها.</p>"], ["🎨 معنی رنگ‌ها", false, "<p><b>رنگ زمین‌ها در نقشه:</b></p><p><span class=\"sw\" style=\"background:#8fc08a\"></span>سبز = زمین خالی (قابل خرید)<br><span class=\"sw\" style=\"background:#7fa8e8\"></span>آبی = زمین خودت<br><span class=\"sw\" style=\"background:#e8d27f\"></span>زرد = زمین هم‌پیمان (حمله ممنوع)<br><span class=\"sw\" style=\"background:#e89a9f\"></span>قرمز = زمین دشمن (قابل حمله)</p><p><b>نوار جان ساختمان:</b> <span class=\"sw\" style=\"background:#2f8f5b\"></span>سبز = سالم (بالای ۵۰٪)، <span class=\"sw\" style=\"background:#e0a526\"></span>زرد = آسیب‌دیده (۲۵ تا ۵۰٪)، <span class=\"sw\" style=\"background:#d4474f\"></span>قرمز = رو به نابودی. نوار فقط وقتی دیده می‌شود که ساختمان آسیب دیده باشد.</p><p><b>رنگ ساختمان‌ها:</b> دیوار آبی <span class=\"sw\" style=\"background:#2f6fd0\"></span>، پاک‌کن صورتی <span class=\"sw\" style=\"background:#f29bb0\"></span>، دستمال سفید <span class=\"sw\" style=\"background:#ffffff\"></span>، مداد/معدن/بانک زرد و طلایی <span class=\"sw\" style=\"background:#f2c14e\"></span>، گنبد شفاف <span class=\"sw\" style=\"background:#99ddee\"></span>، دیوار الماسی <span class=\"sw\" style=\"background:#7fe8ff\"></span>، گاوصندوق/منگنه‌ای خاکستری <span class=\"sw\" style=\"background:#666\"></span>، پدافند بنفش <span class=\"sw\" style=\"background:#9b8cf2\"></span>.</p><p><b>نقشهٔ سه‌بعدی:</b> هر ساختمان ارتفاع‌اش به جانش بستگی دارد (بلندتر = محکم‌تر). مرکز 🏰 با سقف قرمز و ساختمان‌های درآمدی با سقف طلایی دیده می‌شوند. 🛡️ یعنی زمین موقتاً سپر دارد.</p>"], ["💰 اقتصاد و تکه", false, "<p>هر ساختمان درآمدی در «روز بازی» (= ۶۰ ثانیه واقعی) مقدار مشخصی تکه می‌دهد و باید <b>در زمین چیده شود</b>. پیش از کار با انبار، اقتصاد را بساز.</p><table><tr><th>ساختمان</th><th>قیمت</th><th>درآمد/روز</th><th>سطح</th></tr><tr><td>کارخانه کوچک</td><td>۲۰۰</td><td>۲۰۰</td><td>۱</td></tr><tr><td>کارخانه متوسط</td><td>۴۰۰</td><td>۴۰۰</td><td>۱</td></tr><tr><td>معدن مداد</td><td>۳۰۰</td><td>۳۰۰</td><td>۳</td></tr><tr><td>چاپخانه</td><td>۸۰۰</td><td>۷۰۰</td><td>۵</td></tr><tr><td>کتابخانه</td><td>۱۵۰۰</td><td>۱۲۰۰</td><td>۱۵</td></tr><tr><td>بانک تکه</td><td>۳۰۰۰</td><td>۲۰۰۰</td><td>۲۵</td></tr><tr><td>کارخانه A4</td><td>۶۰۰۰</td><td>۴۰۰۰</td><td>۴۰</td></tr><tr><td>معدن طلا</td><td>🏆۵۰</td><td>۳۰۰۰</td><td>—</td></tr></table><p>ضریب سرزمین: سرزمین ۱ = ×۱ ، سرزمین ۲ (سطح ۳۰) = ×۲ ، سرزمین ۳ (سطح ۶۰) = ×۳.<br>درآمد‌ها دشمن‌پسندند: ساختمان درآمدی جانش کم است و با آتش‌افکن ۲.۵ برابر آسیب می‌بیند. پس پشت دفاع بگذارشان.<br>درآمد دیگر: پاداش ورود ۳۰۰ تکه هر ۱۰ دقیقه، ماموریت‌ها، بتل‌پس و غنیمت جنگ (۵۰٪ قیمت ساختمان نابودشده + ۳۰۰ برای فتح زمین).</p><p>ترمیم: ۳۰٪ قیمت ساختمان (مرکز ۱۵۰) و جان را کامل می‌کند.</p>"], ["🛡️ دفاع‌ها", false, "<table><tr><th>دفاع</th><th>جان</th><th>ویژگی</th></tr><tr><td>🟦 دیوار آبی (۱۰۰)</td><td>۱۵</td><td>ارزان؛ در برابر جنگنده و هواپیما ۲ برابر مقاوم، اما کاتر ۲ برابر می‌برد</td></tr><tr><td>🧻 دستمالی (۲۰۰ برای ۲۰ تا)</td><td>۲</td><td>بسیار ضعیف؛ منگنه ×۳ و آتش ×۲.۵ آسیب</td></tr><tr><td>🧵 سیم نخ (۱۵۰ برای ۵ تا)</td><td>۳</td><td>تانک و ای‌کی را ضعیف می‌کند (×۰.۴)</td></tr><tr><td>📎 سیم‌خاردار (۵۰)</td><td>۴</td><td>مثل نخ؛ ضد حمله زمینی</td></tr><tr><td>📡 پدافند (۲۵۰)</td><td>۶</td><td>جنگنده و هواپیما فقط ۳۰٪ اثر دارند</td></tr><tr><td>🖍️ پدافند ماژیک (۵۰۰ ، س۱۲)</td><td>۲۰</td><td>جنگنده/هواپیما ×۰.۲، بمب‌افکن ×۰.۳</td></tr><tr><td>🩹 تله چسب (۱۰۰ برای ۲)</td><td>۱۲</td><td>تانک و ای‌کی ×۰.۳</td></tr><tr><td>🖋️ خندق جوهر (۲۰۰ برای ۳ ، س۳)</td><td>۲۵</td><td>تانک ×۰.۵ ، ای‌کی ×۰.۲</td></tr><tr><td>🪪 کارت ویزیت (۴۰۰ برای ۲)</td><td>۸</td><td>نازک ولی ارزان؛ آتش ×۲.۵</td></tr><tr><td>✏️ برج مداد (۲۵۰ ، س۱)</td><td>۳۰</td><td>دفاع متوسط</td></tr><tr><td>🏯 قلعه مقوایی (۳۰۰)</td><td>۴۰</td><td>کاتر ×۲ و آتش ×۱.۵ آسیب می‌بیند</td></tr><tr><td>📏 خط‌کش فلزی (۳۵۰ ، س۵)</td><td>۵۰</td><td>دیوار بلند</td></tr><tr><td>🗄️ دیوار منگنه‌ای (۴۵۰ ، س۸)</td><td>۳۵</td><td>منگنه فقط ×۰.۳</td></tr><tr><td>📘 سپر کتاب (۴۰۰ ، س۱۰)</td><td>۴۵</td><td>آتش ×۲.۵</td></tr><tr><td>🧽 سد پاک‌کنی (۶۰۰)</td><td>۶۰</td><td>همه حمله‌ها ×۰.۳ جز پرگار و ربات پاک‌کن (×۳)</td></tr><tr><td>🔮 گنبد شفاف (۹۰۰ ، س۲۰)</td><td>۸۰</td><td>بالستیک ×۰.۵ ، هسته‌ای ×۰.۶</td></tr><tr><td>🔐 گاوصندوق (۱۲۰۰ ، س۳۰)</td><td>۱۲۰</td><td>قوی‌ترین دفاع تکه‌ای</td></tr><tr><td>💎 دیوار الماسی (🏆۳۰ برای ۲)</td><td>۱۲۰</td><td>بسیار محکم</td></tr></table>"], ["⚔️ سلاح‌ها", false, "<table><tr><th>سلاح</th><th>قیمت</th><th>قدرت</th><th>نکته</th></tr><tr><td>🔸 ای‌کی‌دار</td><td>۱</td><td>۲</td><td>تقریباً مفت؛ برای خراب کردن دستمال و کارت</td></tr><tr><td>🛩️ هواپیمای کاغذی (س۲)</td><td>۲۵۰</td><td>۱۸</td><td>سریع و ارزان، هوایی</td></tr><tr><td>🚜 تانک ضدآب</td><td>۴۰۰</td><td>۲۰</td><td>زمینی</td></tr><tr><td>🏹 تیرکمان گیره (س۴)</td><td>۳۰۰</td><td>۲۲</td><td></td></tr><tr><td>📐 پرتابه پرگاری</td><td>۵۰۰</td><td>۲۵</td><td>پاک‌کن را ×۳ می‌شکند</td></tr><tr><td>🤖 ربات پاک‌کن (س۸)</td><td>۵۰۰</td><td>۲۸</td><td>پاک‌کن ×۳</td></tr><tr><td>✈️ جنگنده آبی</td><td>۵۰۰</td><td>۳۰</td><td>هوایی</td></tr><tr><td>🔪 کاتر برقی (س۷)</td><td>۴۵۰</td><td>۳۰</td><td>دیوار آبی و قلعه ×۲</td></tr><tr><td>🚀 موشک مداد (س۳)</td><td>۴۵۰</td><td>۳۵</td><td></td></tr><tr><td>🔥 آتش‌افکن (س۱۰)</td><td>۵۵۰</td><td>۳۸</td><td>کاغذی‌ها ×۲.۵ (دستمال، کارخانه، کارت، کتاب)</td></tr><tr><td>🔫 توپ منگنه</td><td>۳۰۰</td><td>۴۰</td><td>دستمال ×۳؛ فقط ۳ بار در کل بازی!</td></tr><tr><td>⚫ بمب جوهر (س۶)</td><td>۶۵۰</td><td>۴۵</td><td></td></tr><tr><td>💣 بمب‌افکن A3 (س۱۲)</td><td>۹۰۰</td><td>۵۵</td><td>هوایی</td></tr><tr><td>🥇 تانک طلایی (🏆۴۰ برای ۳)</td><td>—</td><td>۶۰</td><td></td></tr><tr><td>☄️ بالستیک (س۲۰)</td><td>۱۵۰۰</td><td>۸۰</td><td></td></tr><tr><td>☢️ هسته‌ای (س۴۰)</td><td>۳۰۰۰</td><td>۱۵۰</td><td>یک ضربه تقریباً هر چیزی را می‌کشد</td></tr><tr><td>💧 چسب ماتیکی (۵۵۰ برای ۲)</td><td>۵۵۰</td><td>—</td><td>حریف ۲ حملهٔ بعدی‌اش را از دست می‌دهد</td></tr></table><p>قدرت × ضریب (جدول ضد‌ها) = آسیب. هر حمله فقط <b>یک خانه</b> را می‌زند. اگر خانهٔ خالی بزنی، خطا می‌رود و سلاح نیز مصرف می‌شود.</p>"], ["🎯 قوانین حمله", false, "<ul style=\"padding-right:18px\"><li>یک خانه از شهر دشمن را انتخاب و سلاح را بزن. هر حمله ۴ ثانیه صبر دارد.</li><li>نمی‌توانی به شهر خودت یا هم‌پیمانت حمله کنی (مگر اول خیانت کنی).</li><li>سرزمین‌ها سطح می‌خواهند: ۱ ، ۳۰ ، ۶۰.</li><li>اگر زمینی سپر 🛡️ داشته باشد حمله نمی‌شود؛ بعد از فتح، ۲ دقیقه همهٔ زمین‌های بازنده سپر می‌گیرند.</li><li>اگر روی تو چسب بریزند، چند حمله‌ات هدر می‌رود.</li><li>نابود کردن ساختمان: غنیمت ۵۰٪ قیمت + ۳ جام + ۱۰ امتیاز. نابود کردن مرکز 🏰: فتح زمین، ۳۰۰ تکه، ۳۰ جام ولی دفاع‌کننده ۲۰ جام از دست می‌دهد.</li><li>وقتی به تو حمله شود هشدار قرمز و صدا می‌گیری.</li></ul>"], ["🏰 آرایش‌های جنگی", false, "<p><b>خانهٔ مرکز در وسط (ردیف ۴ ، ستون ۴) ثابت است و فقط ۱۰۰ جان دارد؛ ازش حفاظت کن!</b></p><p><b>۱) لاک‌پشت (حلقه دور مرکز):</b> دور 🏰 دو حلقه بچین؛ حلقه بیرونی دیوار آبی/کارت ویزیت، حلقه داخلی سد پاک‌کنی و گاوصندوق. ساده و مقاوم ولی خرج دارد.</p><p><b>۲) لایه‌ای ضد‌همه:</b> جلو: دستمالی ارزان (طعمه). وسط: نخ + چسب نواری + خندق (ضد زمینی). پشت: پدافند + ماژیک (ضد هوایی). ته: مرکز. دشمن هر سلاح بزند یک ضد در راهش هست.</p><p><b>۳) طعمه و کمین:</b> ساختمان‌های ارزان (دستمال/ای‌کی/کارت) را دور بچین تا دشمن سلاح گران را روی آن‌ها هدر کند، قوی‌ها را وسط ببر.</p><p><b>۴) اقتصادی:</b> کارخانه‌ها را کنار هم در گوشه‌ها بچین و دفاع قوی دورشان. مناسب اوایل بازی تا سطح ۱۰.</p><p><b>۵) ضد فلزی:</b> اگر دشمن منگنه دارد دیوار منگنه‌ای ؛ اگر پرگار دارد از پاک‌کن دوری کن؛ اگر آتش‌افکن دارد کاغذی‌ها را کنار بگذار و قلعه/کتاب را کمتر.</p><p><b>۶) چند شهر:</b> زمین دوم بخر و آن‌جا فقط اقتصاد بساز؛ اگر یک شهر رفت، شهر دیگر نمی‌میرد.</p>"], ["🧠 استراتژی حمله", false, "<p><b>اول بشناس:</b> زمین دشمن را در نقشه ببین و ببین چه دفاعی دارد، بعد ضد‌اش را بزن:</p><ul style=\"padding-right:18px\"><li>دستمالی ← منگنه ×۳ یا آتش ×۲.۵ یا حتی ای‌کی‌دار ارزان</li><li>پاک‌کن ← پرگار یا ربات پاک‌کن</li><li>دیوار آبی / قلعه ← کاتر</li><li>کارخانه‌های کاغذی ← آتش‌افکن (درآمد دشمن را می‌خوابانی)</li><li>گنبد ← خودش سخت است؛ از کنارش برو یا بالستیک بزن</li><li>پدافند/ماژیک ← تانک و موشک بزن نه هواپیما</li><li>ضد زمینی (نخ/جوهر/چسب) ← جنگنده و بمب‌افکن</li></ul><p><b>مسیر کوتاه:</b> مرکز 🏰 فقط ۱۰۰ جان دارد؛ اگر ساختمانی حفاظتش نمی‌کند، مستقیم بزن. دو یا سه ضربهٔ قوی (بالستیک ۸۰ + هر چیز) کافی است.</p><p><b>چسب 💧</b> را قبل از حملهٔ اصلی بزن تا حریف نتواند جواب بدهد.</p><p><b>زمان‌بندی:</b> وقتی سپر 🛡️ تمام شد و حریف آفلاین است حمله کن. همچنین بعد از حملهٔ بزرگ دیگران، شهرهای تضعیف‌شده را بگیر.</p>"], ["⭐ سطح، جام و ماموریت", false, "<p><b>امتیاز تجربه (XP):</b> با خرید، چیدن، حمله و نابود کردن بالا می‌رود. سطح بالاتر سلاح و ساختمان و سرزمین جدید باز می‌کند.</p><p><b>جام 🏆:</b> با نابودی ساختمان (+۳) و فتح (+۳۰) می‌گیری و با باختن از دست می‌دهی. در فروشگاه جام، تانک طلایی و دیوار الماسی و معدن طلا می‌خری.</p><p><b>ماموریت روزانه:</b> ۳ حمله (۴۰۰ تکه)، ۳ ساختمان دشمن نابود (۷۰۰ تکه و ۵ جام)، ۵ چیدن (۳۰۰ تکه). هر روز تازه می‌شود.</p><p><b>بتل‌پس:</b> هر ۱۵۰ امتیاز یک مرحله؛ هر مرحله تکه می‌دهد و مراحل ۵ ، ۱۰ ، ۱۵ ، ۲۰ سلاح ویژه (هواپیما، کاتر، بمب‌افکن، بالستیک) و جام می‌دهند.</p><p><b>رتبه‌ها:</b> سرباز، سروان (۱ فتح)، سرهنگ (۳)، سرلشکر (۶)، فرمانده کل (۱۰). <b>القاب سطح:</b> کاغذ آبی ← بی‌آب (۱۰) ← معمولی (۲۰) ← ناپاره (۳۰) ← A4 (۶۰).</p>"], ["🤝 اتحاد، هدیه و خیانت", false, "<p>در تب «اتحاد» کنار اسم یک فرمانده روی «درخواست اتحاد» بزن؛ اگر او قبول کند هم‌پیمان می‌شوید. هم‌پیمان‌ها نمی‌توانند به هم حمله کنند و می‌توانند تکه هدیه بدهند. زمین هم‌پیمان در نقشه زرد دیده می‌شود.</p><p><b>خیانت 🗡️:</b> اولین حمله به هم‌پیمان خیانت حساب می‌شود: از اتحاد خارج می‌شوی و لقب «خائن» می‌گیری. دکمهٔ «خیانت و خروج» هم همین کار را بدون حمله می‌کند.</p>"], ["💡 نکتهٔ طلایی", false, "<p>اول اقتصاد (۲–۳ کارخانه)، بعد دفاع لایه‌ای، آخر حمله. همیشه ساختمان آسیب‌دیده را ترمیم کن و مرکز را سالم نگه دار. اگر دشمن قوی‌تر است، حمله نکن؛ زمین دوم بخر و از آن لذت ببر 😉</p>"]];
